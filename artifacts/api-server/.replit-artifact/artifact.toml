kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
name = "Review Dashboard"
localPort = 8000
paths = ["/dashboard"]

[services.development]
run = "cd /home/runner/workspace/review_intel_app && uv run --project /home/runner/workspace python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.baseUrlPath dashboard --browser.gatherUsageStats false"

[services.env]
PORT = "8000"

[services.production.run]
args = ["sh", "-c", "cd review_intel_app && python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.baseUrlPath dashboard --browser.gatherUsageStats false"]

[services.production.health.startup]
path = "/dashboard/_stcore/health"
