kind = "video"
videoAspectRatio = "16:9"
previewPath = "/"
title = "Review Intelligence Demo"
description = "A two-minute animated product demo for restaurant owners, showing how Review Intelligence turns guest feedback into clear themes, early warnings, staff recognition, manager-approved reply drafts, and weekly summaries."
version = "1.0.0"
id = "artifacts/review-intelligence-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22845

[services.development]
run = "pnpm --filter @workspace/review-intelligence-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/review-intelligence-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/review-intelligence-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22845"
BASE_PATH = "/"
